name: Build Telegram APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        continue-on-error: true
        id: setup-sdk
      
      - name: Install Android SDK components manually
        if: steps.setup-sdk.outcome != 'success'
        run: |
          sudo rm -rf /usr/local/lib/android/sdk/cmdline-tools/latest/*
          
          cd /tmp
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q commandlinetools-linux-11076708_latest.zip
          
          cp -r cmdline-tools/* /usr/local/lib/android/sdk/cmdline-tools/latest/
          rm -rf cmdline-tools commandlinetools-linux-11076708_latest.zip
          
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export PATH=$PATH:$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools
          
          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"
      
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: ${{ runner.os }}-gradle-
      
      - name: Inject API Keys
        run: |
          sed -i "s/public static int API_ID = .*;/public static int API_ID = ${{ secrets.API_ID }};/" TMessagesProj/src/main/java/org/telegram/messenger/BuildVars.java
          sed -i "s/public static String API_HASH = \".*\";/public static String API_HASH = \"${{ secrets.API_HASH }}\";/" TMessagesProj/src/main/java/org/telegram/messenger/BuildVars.java
      
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
      
      - name: Build Release APK
        run: ./gradlew assembleRelease --no-daemon
      
      - name: Find all APK files
        run: |
          echo "=== Searching for ALL APK files ==="
          find . -name "*.apk" -type f -exec ls -lh {} \;
          echo "=== End search ==="
      
      - name: Upload all APK files
        uses: actions/upload-artifact@v4
        with:
          name: Telegram-APKs
          path: '**/*.apk'
          if-no-files-found: error
          retention-days: 7
