name: Build Telegram APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive
      
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
      
      - name: Inject API Keys
        run: |
          sed -i "s/public static int API_ID = .*;/public static int API_ID = ${{ secrets.API_ID }};/" TMessagesProj/src/main/java/org/telegram/messenger/BuildVars.java
          sed -i "s/public static String API_HASH = \".*\";/public static String API_HASH = \"${{ secrets.API_HASH }}\";/" TMessagesProj/src/main/java/org/telegram/messenger/BuildVars.java
      
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
      
      - name: Build Release APK
        run: ./gradlew assembleRelease
      
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Telegram-Release
          path: TMessagesProj/build/outputs/apk/release/TMessagesProj-release.apk
